name: Diagnóstico (só leitura) de atletas entregues duplicados

on:
  workflow_dispatch:

concurrency:
  group: entregas-run-deploy
  cancel-in-progress: false

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler dados na VPS sem alterar nada
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -eu
            cd /opt/entregas-run
            git fetch --quiet origin main
            git show '${{ github.sha }}:scripts/diagnostico-duplicatas.mjs' > /tmp/entregas-run-diagnostico-${{ github.sha }}.mjs
            # Mesmo padrão da trava do deploy: contêiner descartável, sem rede, dados só leitura.
            docker run --rm --network none --read-only \
              --mount "type=bind,src=/opt/entregas-run/data,dst=/app/data,readonly" \
              --mount "type=bind,src=/tmp/entregas-run-diagnostico-${{ github.sha }}.mjs,dst=/tmp/diagnostico.mjs,readonly" \
              --entrypoint node "$(docker inspect -f '{{.Image}}' entregas-run-web)" /tmp/diagnostico.mjs /app/data
            rm -f /tmp/entregas-run-diagnostico-${{ github.sha }}.mjs
