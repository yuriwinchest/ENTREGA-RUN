name: CI/CD Deploy ENTREGAS-RUN (VPS Docker)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: entregas-run-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar Build de Produção (Client)
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validar Servidor e Permissões Administrativas
        working-directory: server
        run: |
          npm ci
          node --check server.js
          node --test admin-users.test.mjs

      - name: Validar Script de Deploy
        run: bash -n scripts/deploy-vps.sh

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Commit Validado com Snapshot, Healthcheck e Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -eu
            cd /opt/entregas-run
            git fetch --quiet origin main
            git cat-file -e '${{ github.sha }}^{commit}'
            git show '${{ github.sha }}:scripts/deploy-vps.sh' > /tmp/entregas-run-deploy-${{ github.sha }}.sh
            bash /tmp/entregas-run-deploy-${{ github.sha }}.sh '${{ github.sha }}'
