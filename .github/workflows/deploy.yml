name: CI/CD Deploy ENTREGAS-RUN (VPS Docker)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: entregas-run-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar Build de Produção (Client)
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validar Servidor e Permissões Administrativas
        working-directory: server
        run: |
          npm ci
          node --check server.js
          node --test admin-users.test.mjs

      - name: Validar Script de Deploy
        run: bash -n scripts/deploy-vps.sh

  preflight:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Conferir VPS sem alterar o serviço
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -eu
            cd /opt/entregas-run
            test -f .env
            grep -q '^ADMIN_PASSWORD=.' .env
            test -f docker-compose.yml
            test -f data/users.json
            command -v flock
            command -v tar
            command -v sha256sum
            docker inspect entregas-run-web >/dev/null
            docker compose version
            curl --silent --fail --max-time 5 http://127.0.0.1:3050/api/health >/dev/null
            df -P . | awk 'NR==2 {gsub(/%/, "", $5); print "disk_used_percent=" $5; if ($5 >= 80) exit 1}'
            echo 'VPS preflight OK'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Commit Validado com Snapshot, Healthcheck e Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -eu
            cd /opt/entregas-run
            git fetch --quiet origin main
            git cat-file -e '${{ github.sha }}^{commit}'
            git show '${{ github.sha }}:scripts/deploy-vps.sh' > /tmp/entregas-run-deploy-${{ github.sha }}.sh
            bash /tmp/entregas-run-deploy-${{ github.sha }}.sh '${{ github.sha }}'
