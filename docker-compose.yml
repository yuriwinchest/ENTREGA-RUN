version: "3.8"

services:
  entregas-run-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entregas-run-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - ADMIN_EMAIL=${ADMIN_EMAIL:-pacetime@entregas.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-}
      - APPWRITE_COLLECTION_EVENTS=${APPWRITE_COLLECTION_EVENTS:-events}
      - APPWRITE_COLLECTION_ATHLETES=${APPWRITE_COLLECTION_ATHLETES:-athletes}
      - APPWRITE_COLLECTION_USERS=${APPWRITE_COLLECTION_USERS:-user_profiles}
      - APPWRITE_COLLECTION_AUDITS=${APPWRITE_COLLECTION_AUDITS:-audit_logs}
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
